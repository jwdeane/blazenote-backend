name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "blazenote-api.cflr.dev"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "blazenote"
database_id = "29edddae-fbb5-420e-9d5d-ead1e887091a"
migrations_dir = "./migrations"

